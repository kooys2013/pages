<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>가상자산 이용자 보호 등에 관한 법률 — 한 장 체계도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg-soft:#F7F8F7; --border:#E3E6E3; --border-dim:#EEF0EE;
  --text:#1A1D1A; --text2:#4A524A; --text3:#8A928A;
  --accent:#1E7A46; --accent-bg:#E8F4EC;
  --risk:#C77700; --risk-bg:#FBF3E4;
  --wait:#9AA39A; --wait-bg:#F2F3F2;
  --danger:#B3261E;
  --font-sans:'Pretendard','IBM Plex Sans KR',-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;}
body{font-size:15px;line-height:1.6;padding-bottom:64px;}
a{color:var(--accent)}
.wrap{max-width:1160px;margin:0 auto;padding:24px 20px 0;}

/* ---------- header ---------- */
header.dashboard{border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:24px;}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
.badge{font-family:var(--font-mono);font-size:12px;padding:3px 9px;border:1px solid var(--border);
  border-radius:4px;color:var(--text2);background:var(--bg);}
.badge.verify{border-color:var(--accent);color:var(--accent);font-weight:600;}
.badge.verify::before{content:"● ";}
h1{font-size:26px;line-height:1.35;margin:0 0 10px;font-weight:700;}
.one-liner{color:var(--text2);font-size:15px;margin:0 0 18px;max-width:820px;}
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border-dim);}
.stat{padding:14px 12px 4px;border-left:1px solid var(--border-dim);}
.stat:first-child{border-left:none;padding-left:0;}
.stat .num{font-family:var(--font-mono);font-weight:700;font-size:22px;display:block;}
.stat .label{font-size:12px;color:var(--text3);}
.stat.warn .num{color:var(--risk);}

/* ---------- as-of / disclaimer ---------- */
.meta-strip{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--text3);margin-top:14px;}
.meta-strip b{color:var(--text2);font-weight:600;}

/* ---------- section headers ---------- */
section{margin-bottom:36px;}
.sec-title{font-size:17px;font-weight:700;margin:0 0 4px;}
.sec-desc{font-size:13px;color:var(--text3);margin:0 0 14px;}

/* ---------- toggle ---------- */
.toggle-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.toggle-btn{font-family:var(--font-mono);font-size:12.5px;padding:6px 14px;border:1px solid var(--border);
  border-radius:20px;background:var(--bg);color:var(--text2);cursor:pointer;}
.toggle-btn.active{background:var(--text);color:#fff;border-color:var(--text);}
.scroll-hint{font-size:12px;color:var(--text3);margin-left:auto;}
.scroll-hint::before{content:"↔ ";}

/* ---------- diagram ---------- */
.diagram-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg-soft);
  padding:14px;position:relative;}
.diagram-inner{position:relative;min-width:920px;}
table.grid{border-collapse:collapse;width:100%;table-layout:fixed;position:relative;z-index:2;background:transparent;}
table.grid th, table.grid td{border:1px solid var(--border-dim);vertical-align:top;padding:6px;}
table.grid th{background:var(--bg);font-size:12px;color:var(--text2);font-weight:600;text-align:left;padding:8px 6px;}
table.grid th.corner{background:var(--bg-soft);border:none;}
table.grid td.lane-head{background:var(--bg);font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;width:140px;}
table.grid td.lane-head .kind{display:block;font-size:10px;font-weight:400;color:var(--text3);font-family:var(--font-mono);}
table.grid td.cell{min-width:150px;}
svg.edges{position:absolute;inset:0;pointer-events:none;z-index:1;width:100%;height:100%;}
.edge{fill:none;stroke:var(--text3);stroke-width:1.6;}
.edge-regress{fill:none;stroke:var(--risk);stroke-width:1.6;stroke-dasharray:5 4;}

.node{border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:6px;background:var(--bg);
  cursor:pointer;font-size:12.5px;position:relative;transition:box-shadow .12s;}
.node:hover{box-shadow:0 0 0 2px var(--accent-bg);}
.node.selected{box-shadow:0 0 0 2px var(--accent);}
.node .nid{font-family:var(--font-mono);font-weight:700;font-size:11px;color:var(--text3);margin-right:4px;}
.node .nstat{font-family:var(--font-mono);font-size:10px;padding:1px 5px;border-radius:3px;float:right;}
.node .nname{display:block;margin-top:3px;font-weight:500;line-height:1.35;}
.node .nregress{display:block;margin-top:3px;font-size:10.5px;color:var(--risk);}
.node.st-done{background:var(--bg-soft);border-color:var(--border);}
.node.st-done .nstat{background:var(--border-dim);color:var(--text2);}
.node.st-current{border-color:var(--accent);border-width:2px;background:var(--accent-bg);}
.node.st-current .nstat{background:var(--accent);color:#fff;}
.node.st-risk{border-color:var(--risk);border-style:dashed;background:var(--risk-bg);}
.node.st-risk .nstat{background:var(--risk);color:#fff;}
.node.st-wait{border-style:dashed;color:var(--text3);}
.node.st-wait .nstat{background:var(--wait-bg);color:var(--text3);}
.node.hidden{display:none;}
.node .warn-icon{color:var(--risk);}

.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:11.5px;color:var(--text3);align-items:center;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;}
.sw.done{background:var(--bg-soft);border:1px solid var(--border);}
.sw.risk{background:var(--risk-bg);border:1px dashed var(--risk);}
.sw.wait{background:#fff;border:1px dashed var(--wait);}
.ln{width:16px;height:0;border-top:1.6px solid var(--text3);display:inline-block;}
.ln.rg{border-top:1.6px dashed var(--risk);}

/* ---------- detail panel ---------- */
.detail-panel{border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-top:16px;background:var(--bg);min-height:64px;}
.detail-empty{color:var(--text3);font-size:13px;}
.detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.detail-head .did{font-family:var(--font-mono);font-weight:700;}
.detail-path{font-size:12px;color:var(--text3);margin-bottom:10px;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chip{font-size:11.5px;border:1px solid var(--border);border-radius:4px;padding:2px 8px;color:var(--text2);background:var(--bg-soft);}
.kv-row{display:flex;gap:0;border:1px solid var(--border-dim);border-radius:6px;overflow:hidden;margin-bottom:10px;max-width:420px;}
.kv{flex:1;padding:8px 12px;border-left:1px solid var(--border-dim);}
.kv:first-child{border-left:none;}
.kv .k{font-size:11px;color:var(--text3);}
.kv .v{font-family:var(--font-mono);font-weight:600;font-size:13px;}
.basis-list{list-style:none;padding:0;margin:0 0 8px;font-size:13px;}
.basis-list li{padding:6px 0;border-top:1px dotted var(--border-dim);}
.basis-list li:first-child{border-top:none;}
.basis-list a{font-weight:600;text-decoration:none;}
.basis-list a:hover{text-decoration:underline;}
.basis-list .b-summary{color:var(--text2);font-size:12.5px;}
.basis-list .unverified{color:var(--danger);font-size:11px;font-family:var(--font-mono);}
.bottleneck-note{font-size:12.5px;background:var(--risk-bg);border:1px solid var(--risk);border-radius:6px;
  padding:8px 10px;color:#7a4d00;margin-top:4px;}
.bottleneck-note::before{content:"⚠ 병목 · ";font-weight:700;}

/* ---------- 8-slot canvas ---------- */
.canvas-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.slot{border:1px solid var(--border);border-radius:8px;padding:14px 16px;background:var(--bg);}
.slot.bottleneck-slot{background:var(--risk-bg);border-color:var(--risk);}
.slot h3{font-size:13px;margin:0 0 8px;color:var(--text2);font-weight:700;}
.slot h3 .n{font-family:var(--font-mono);color:var(--text3);font-weight:400;margin-right:4px;}
.slot p, .slot li{font-size:13px;color:var(--text);line-height:1.55;}
.slot ul{margin:0;padding-left:18px;}
.slot ul li{margin-bottom:6px;}
.slot .src{font-size:12px;color:var(--text2);margin-bottom:6px;padding-bottom:6px;border-bottom:1px dotted var(--border-dim);}
.slot .src:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.slot .src a{font-weight:600;}
.related-item{font-size:12.5px;margin-bottom:8px;}
.related-item .t{font-weight:600;}
.related-item .w{color:var(--text3);display:block;}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--border);padding-top:16px;font-size:12px;color:var(--text3);}
footer .report-link{color:var(--accent);font-weight:600;}

@media (max-width:820px){
  .stat-row{grid-template-columns:repeat(3,1fr);}
  .stat:nth-child(4){border-left:none;padding-left:0;margin-top:8px;}
  .canvas-grid{grid-template-columns:1fr;}
  .kv-row{max-width:100%;}
  h1{font-size:21px;}
}
</style>
</head>

    </div>
  </section>

  <section id="canvasSection">
    <p class="sec-title">한 장 캔버스 — 고정 8슬롯</p>
    <p class="sec-desc">대상마다 슬롯 구성은 바꾸지 않습니다. 해당 내용이 없으면 "해당 없음"으로 표기합니다.</p>
    <div class="canvas-grid" id="canvasGrid"></div>
  </section>

  <footer>
    <div id="footerMeta"></div>
  </footer>

</div>

    {num: bottleneckCount, label:'병목 구간', warn: bottleneckCount > 0}
  ];
  statRow.innerHTML = stats.map(s => `<div class="stat${s.warn?' warn':''}"><span class="num">${s.num}</span><span class="label">${s.label}</span></div>`).join('');

  const metaStrip = document.getElementById('metaStrip');
  metaStrip.innerHTML = `
    <span><b>원문 기준일</b> ${meta.as_of} (법률 시행 2024-07-19 / 시행령 시행 2025-04-23)</span>
    <span><b>검증</b> ${verification.checker} · ${verification.checked_at}</span>
    <span><b>고지</b> ${meta.disclaimer}</span>
    <span><b>오류 신고</b> <a class="report-link" href="${verification.report_channel}">${verification.report_channel}</a></span>
  `;

  document.getElementById('footerMeta').innerHTML = `
    ${meta.title} 한 장 체계도 · onepage-canvas 스킬 산출물 · 기준일 ${meta.as_of} ·
    검증상태 <b>${verification.status}</b> (${basisChecked}/${basisTotal}) ·
    본 문서는 참고자료이며 법적 자문이 아닙니다. 오류 신고: <a class="report-link" href="${verification.report_channel}">${verification.report_channel}</a>
  `;

  /* ---------- diagram grid ---------- */
  const gridTable = document.getElementById('gridTable');
  let mode = 'core';

  function laneIndex(id){ return lanes.findIndex(l => l.id === id); }
  function gateIndex(id){ return gates.findIndex(g => g.id === id); }

  function buildGrid(){
    let thead = '<tr><th class="corner"></th>' + gates.map(g => `<th>${g.id} · ${g.name}</th>`).join('') + '</tr>';
    let rows = lanes.map(lane => {
      let cells = gates.map(gate => {
        const cellNodes = nodes.filter(n => n.lane === lane.id && n.gate === gate.id);
        const html = cellNodes.map(n => nodeCardHtml(n)).join('');
        return `<td class="cell" data-lane="${lane.id}" data-gate="${gate.id}">${html}</td>`;
      }).join('');
      return `<tr><td class="lane-head">${lane.name}<span class="kind">${lane.kind === 'system' ? 'SYSTEM' : 'ACTOR'}</span></td>${cells}</tr>`;
    }).join('');
    gridTable.innerHTML = thead + rows;
  }

  function nodeCardHtml(n){
    const hidden = (mode === 'core' && !n.core) ? ' hidden' : '';
    const regressNote = (n.regress_to && n.regress_to.length)
      ? `<span class="nregress">↩ ${n.id} → ${n.regress_to.join(',')} 재확인 대기</span>` : '';
    return `<div class="node st-${n.status}${hidden}" data-node="${n.id}">
      <span class="nstat">${STATUS_LABEL[n.status]||n.status}</span>
      <span class="nid">${n.id}</span>
      <span class="nname">${n.name}${n.confidence<50?' <span class="warn-icon">⚠️</span>':''}</span>
      ${regressNote}
    </div>`;
  }

  function drawEdges(){
    const svg = document.getElementById('edgeSvg');
    const inner = document.getElementById('diagramInner');
    svg.innerHTML = '';
    const c = inner.getBoundingClientRect();
    inner.style.height = gridTable.getBoundingClientRect().height + 'px';

    function getEl(id){ return gridTable.querySelector(`.node[data-node="${id}"]`); }
    function visible(el){ return el && !el.classList.contains('hidden'); }

    function drawEdge(fromId, toId, regress){
      const fromEl = getEl(fromId), toEl = getEl(toId);
      if(!visible(fromEl) || !visible(toEl)) return;
      const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
      const x1 = a.right - c.left, y1 = a.top + a.height/2 - c.top;
      const x2 = b.left - c.left, y2 = b.top + b.height/2 - c.top;
      let d;
      if(regress){
        const midx = (x1+x2)/2, topY = Math.min(y1,y2) - 36;
        d = `M${x2},${y2} Q${midx},${topY} ${x1},${y1}`;
      } else {
        d = `M${x1},${y1} L${x2},${y2}`;
      }
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', d);
      p.setAttribute('class', regress ? 'edge-regress' : 'edge');
      if(!regress){
        p.setAttribute('marker-end', 'url(#arrow)');
      }
      svg.appendChild(p);
    }

    // arrow marker def
    const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
    defs.innerHTML = `<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="var(--text3)"></path></marker>`;
    svg.appendChild(defs);

    nodes.forEach(n => {
      (n.edges_to||[]).forEach(t => drawEdge(n.id, t, false));
      (n.regress_to||[]).forEach(t => drawEdge(n.id, t, true));
    });
  }

  function render(){
    buildGrid();
    drawEdges();
    requestAnimationFrame(drawEdges);
    setTimeout(drawEdges, 300);
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(drawEdges).catch(()=>{}); }
    gridTable.querySelectorAll('.node').forEach(el => {
      el.addEventListener('click', () => selectNode(el.getAttribute('data-node')));
    });
  }

  let debounceTimer;
  window.addEventListener('resize', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(drawEdges, 150);
  });

  document.getElementById('btnCore').addEventListener('click', () => setMode('core'));
  document.getElementById('btnFull').addEventListener('click', () => setMode('full'));
  function setMode(m){
    mode = m;
    document.getElementById('btnCore').classList.toggle('active', m==='core');
    document.getElementById('btnFull').classList.toggle('active', m==='full');
    render();
  }

  /* ---------- detail panel ---------- */
  function selectNode(id){
    const n = nodeById[id];
    if(!n) return;
    gridTable.querySelectorAll('.node').forEach(el => el.classList.toggle('selected', el.getAttribute('data-node')===id));
    const lane = lanes.find(l => l.id === n.lane);
    const gate = gates.find(g => g.id === n.gate);
    const docsHtml = (n.docs||[]).map(d => `<span class="chip">${d}</span>`).join('');
    const basisHtml = (n.basis||[]).map(b => `<li>
        <a href="${b.url}" target="_blank" rel="noopener">${b.label}</a>
        ${b.verified ? '' : '<span class="unverified">확인필요</span>'}<br>
        <span class="b-summary">${b.summary||''}</span>
      </li>`).join('');
    const kvHtml = `
      <div class="kv"><span class="k">기한</span><br><span class="v">${n.deadline||'명시 없음'}</span></div>
      <div class="kv"><span class="k">확신도</span><br><span class="v">${n.confidence!=null?n.confidence+'%':'-'}${CONF_ICON(n.confidence||100)}</span></div>
    `;
    document.getElementById('detailPanel').innerHTML = `
      <div class="detail-head">
        <span class="did">${n.id}</span>
        <span class="badge">${STATUS_LABEL[n.status]||n.status}</span>
        <strong>${n.name}</strong>
      </div>
      <div class="detail-path">${gate?gate.id+' '+gate.name:''} · ${lane?lane.name:''}</div>
      ${docsHtml?`<div class="chip-row">${docsHtml}</div>`:''}
      <div class="kv-row">${kvHtml}</div>
      <div><strong style="font-size:12.5px;color:var(--text2)">법적 근거</strong>
        <ul class="basis-list">${basisHtml || '<li>해당 없음</li>'}</ul>
      </div>
      ${n.bottleneck ? `<div class="bottleneck-note">${n.bottleneck}</div>` : ''}
    `;
  }

  /* ---------- 8-slot canvas ---------- */
  const cv = canvas;
  const slots = [];
  slots.push({
    n:1, title:'목적과 법적 근거',
    body: `<p>${cv.purpose_basis.purpose}</p>` +
      cv.purpose_basis.sources.map(s => `<div class="src"><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a> (${s.kind})<br>` +
        s.articles.map(a => `${a.ref} — ${a.gist}${a.verified?'':' <span class="unverified">확인필요</span>'}`).join('<br>') + `</div>`).join('')
  });
  slots.push({ n:2, title:'권한 관계',
    body:`<ul>${cv.authority.map(a=>`<li><b>${a.org}</b> — ${a.role}</li>`).join('')}</ul>` });
  slots.push({ n:3, title:'돈의 흐름', body:`<p>${cv.money_flow}</p>` });
  slots.push({ n:4, title:'문서의 흐름', body:`<p>${cv.document_flow}</p>` });
  slots.push({ n:5, title:'병목', bottleneck:true,
    body:`<ul>${cv.bottlenecks.map(b=>`<li>${b}</li>`).join('')}</ul>` });
  slots.push({ n:6, title:'개선점', body:`<ul>${cv.improvements.map(b=>`<li>${b}</li>`).join('')}</ul>` });
  slots.push({ n:7, title:'관련 제도', body: cv.related.length ?
      cv.related.map(r=>`<div class="related-item"><span class="t">${r.title}</span><span class="w">${r.why}</span></div>`).join('')
      : '<p>해당 없음</p>' });
  slots.push({ n:8, title:'현장 검증 필요', body:`<ul>${cv.field_verification_needed.map(b=>`<li>${b}</li>`).join('')}</ul>` });

  document.getElementById('canvasGrid').innerHTML = slots.map(s =>
    `<div class="slot${s.bottleneck?' bottleneck-slot':''}"><h3><span class="n">#${s.n}</span>${s.title}</h3>${s.body}</div>`
  ).join('');

  render();
})();
</script>
</body>
</html>
